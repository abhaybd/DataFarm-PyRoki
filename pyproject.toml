[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datafarm-pyroki"
version = "0.1.0"
description = "Pretrained DATAFARM motion encoder in JAX, with PyRoki trajectory costs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["huggingface-hub>=2.3,<3", "jax>=0.6.0", "numpy>=1.26", "scipy>=1.13"]

[project.optional-dependencies]
planning = ["pyroki", "jaxls"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "torch>=2.6"]

[tool.uv.sources]
pyroki = { git = "https://github.com/chungmin99/pyroki.git", rev = "388e43e1fc0d0ee382968d3dd72970fd62a0450c" }
jaxls = { git = "https://github.com/brentyi/jaxls.git", rev = "50a58be88c5ef74532f09e3f55268b4f02c490e3" }

[tool.uv]
override-dependencies = ["jaxls @ git+https://github.com/brentyi/jaxls.git@50a58be88c5ef74532f09e3f55268b4f02c490e3"]

[tool.hatch.build]
exclude = ["**/*.npz", "**/*.npy", "**/*.pt", "**/*.pth", "**/*.safetensors", "work/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/datafarm_pyroki"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I"]
